title: drama Documentation
source: ./src
output: ./docs
format: markdown
exclude:
- __pycache__
- .venv
- venv
- .git
- node_modules
- .tox
- .mypy_cache
- .pytest_cache
- dist
- build
- '*.egg-info'
exclude_private: false
port: 8000
ai:
  enabled: true
  model: llama-3.1-8b-instant
  style: google
  max_tokens: 300
