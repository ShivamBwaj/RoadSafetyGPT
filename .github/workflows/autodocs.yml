# Auto-generated by: autodocs init
# Builds documentation and deploys to GitHub Pages on every push to main.
#
# Setup required:
#   1. Go to repo Settings → Pages → Source → "GitHub Actions"
#   2. Add GROQ_API_KEY as a repository secret (Settings → Secrets → Actions)
#      Get a free key at https://console.groq.com

name: Deploy Docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install autodocs
        run: pip install "autodocs[ai] @ git+https://github.com/ShivamBwaj/autodocs.git"

      - name: Generate documentation
        run: autodocs generate --source ./ --output _site --format html --ai --incremental
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
